name: Update data & predictions

on:
  schedule:
    - cron: "17 */2 * * *" # every 2 hours
  workflow_dispatch:
    inputs:
      backfill:
        description: "Optional: seasons to backfill first (e.g. 2024-2027). Leave empty for a normal run."
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cdl-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install .

      - name: Backfill
        if: ${{ github.event.inputs.backfill != '' }}
        run: cdl backfill --seasons "${{ github.event.inputs.backfill }}"

      - name: Update (scrape, retrain, predict, grade, publish, notify)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CDL_SITE_URL: ${{ vars.CDL_SITE_URL }}
        run: cdl update

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: automated update $(date -u +'%Y-%m-%d %H:%M') [skip ci]"
            git pull --rebase --autostash
            git push
          fi

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
