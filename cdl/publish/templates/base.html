<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CDL Predictor{% endblock %}</title>
<link rel="stylesheet" href="{{ root }}static/style.css">
<script>try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
<header class="site">
  <a class="brand" href="{{ root }}index.html">CDL Predictor</a>
  <nav>
    <a href="{{ root }}index.html" class="{{ 'active' if page == 'index' }}">Matches</a>
    <a href="{{ root }}rankings.html" class="{{ 'active' if page == 'rankings' }}">Power rankings</a>
    <a href="{{ root }}record.html" class="{{ 'active' if page == 'record' }}">Track record</a>
  </nav>
  <span class="updated">Updated {{ generated }}</span>
  <button class="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Toggle colour theme">◐</button>
</header>
<main>
{% block body %}{% endblock %}
</main>
<footer>Data from breakingpoint.gg · predictions are made and locked before each match starts · model v{{ model_version }}</footer>
<div id="tip" role="tooltip"></div>
<script>
function toggleTheme(){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('theme',r.dataset.theme)}catch(e){}}
const tip=document.getElementById('tip');
document.addEventListener('pointerover',e=>{const el=e.target.closest('[data-tip]');if(!el)return;tip.innerHTML=el.dataset.tip;tip.style.display='block';});
document.addEventListener('pointermove',e=>{if(tip.style.display!=='block')return;const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8);tip.style.left=x+'px';tip.style.top=(e.clientY+14)+'px';});
document.addEventListener('pointerout',e=>{if(e.target.closest('[data-tip]'))tip.style.display='none';});
</script>
</body>
</html>
