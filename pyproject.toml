[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdl-predictor"
version = "3.0.0"
description = "Automated Call of Duty League data pipeline and match predictor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
cdl = "cdl.cli:app"

[tool.setuptools.packages.find]
include = ["cdl*"]

[tool.setuptools.package-data]
cdl = ["store/schema.sql", "publish/templates/*", "publish/static/*"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
